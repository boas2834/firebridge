<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Nur root darf den Namen besitzen, nur die Gruppe "firebridge" darf den Dienst steuern. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.boas2834.Firebridge1"/>
    <allow send_destination="io.github.boas2834.Firebridge1"/>
  </policy>
  <policy group="firebridge">
    <allow send_destination="io.github.boas2834.Firebridge1"/>
  </policy>
  <!--@USER_POLICY@-->
  <policy context="default">
    <deny own="io.github.boas2834.Firebridge1"/>
    <deny send_destination="io.github.boas2834.Firebridge1"/>
  </policy>
</busconfig>
