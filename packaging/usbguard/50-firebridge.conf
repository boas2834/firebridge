# Firebridge (Etappe 4): Was USBGuard beim Einstecken ohne Rückfrage zulässt.
#
# Alles andere bleibt gesperrt (ImplicitPolicyTarget=block), bis es in der Firebridge-Oberfläche
# freigegeben wird, Tastaturen nur nach der Tipp-Probe. Ein Speicher, der sich zusätzlich als
# Tastatur oder Netzwerkkarte meldet, passt auf keine dieser Regeln und bleibt immer gesperrt.
#
# "equals" vergleicht auch die Anzahl der Schnittstellen, deshalb je eine Zeile für 1 bis 3
# (UAS-Sticks und Festplatten melden z. B. 08:06:50 und 08:06:62, Hubs 09:00:01 und 09:00:02).
allow with-interface equals { 08:*:* }
allow with-interface equals { 08:*:* 08:*:* }
allow with-interface equals { 08:*:* 08:*:* 08:*:* }
allow with-interface equals { 09:00:* }
allow with-interface equals { 09:00:* 09:00:* }
allow with-interface equals { 09:00:* 09:00:* 09:00:* }
